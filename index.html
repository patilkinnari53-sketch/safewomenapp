

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safe Women App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div class="login-container" id="loginPage">
  <h2>Login</h2>
  <input type="text" id="loginUsername" placeholder="Username">
  <input type="password" id="loginPassword" placeholder="Password">
  <button type="button" onclick="login()">Login</button>
  <p>New user? <span onclick="showRegister()">Register</span></p>
  <p id="loginError"></p>
</div>

<!-- REGISTER -->
<div class="login-container" id="registerPage" style="display:none;">
  <h2>Register</h2>
  <input type="text" id="regUsername" placeholder="Create Username">
  <input type="password" id="regPassword" placeholder="Create Password">
  <button type="button" onclick="register()">Register</button>
  <p>Already registered? <span onclick="showLogin()">Login</span></p>
  <p id="registerError"></p>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboardPage" style="display:none;">
  <h2>Safe Women Dashboard</h2>
  <button onclick="logout()">Logout</button>
</div>

<script src="script.js"></script>
</body>
</html>

  <div class="menu">
    <button onclick="showSection('location')">📍 Live Location</button>
    <button onclick="showSection('sos')">🚨 SOS</button>
    <button onclick="showSection('defense')">🥋 Self Defense</button>
    <button onclick="logout()">🚪 Logout</button>
  </div>

  <div class="section" id="location">
    <button onclick="getLocation()">Get Location</button>
    <p id="locationOutput"></p>
  </div>

  <div class="section" id="sos">
    <a href="tel:112"><button class="sos-btn">CALL 112</button></a>
  </div>

  <div class="section" id="defense">
    <ul class="defense-list">
      <li>👊 Hit nose or eyes</li>
      <li>🦵 Kick knee</li>
      <li>🗣️ Shout loudly</li>
      <li>🏃 Run to safe place</li>
    </ul>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
