<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safe Women App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div class="login-container" id="loginBox">
  <h2>🔐 Login</h2>
  <input type="text" id="loginUser" placeholder="Username">
  <input type="password" id="loginPass" placeholder="Password">
  <button onclick="login()">Login</button>
  <p>New user? <span onclick="showRegister()">Register</span></p>
  <p id="loginError" class="error"></p>
</div>

<!-- REGISTER -->
<div class="login-container" id="registerBox" style="display:none;">
  <h2>📝 Register</h2>
  <input type="text" id="regUser" placeholder="Create Username">
  <input type="password" id="regPass" placeholder="Create Password">
  <button onclick="register()">Register</button>
  <p>Already registered? <span onclick="showLogin()">Login</span></p>
  <p id="regError" class="error"></p>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard" style="display:none;">
  <h2>👩‍🦰 Safe Women Dashboard</h2>

  <button class="sos" onclick="sos()">🚨 SOS Emergency</button>
  <button onclick="getLocation()">📍 Share Live Location</button>
  <button onclick="showDefense()">🥋 Self Defense Tips</button>
  <button onclick="logout()">🚪 Logout</button>

  <div id="output"></div>
</div>

<script src="script.js"></script>
</body>
</html>
