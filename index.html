<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safe Women App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-container" id="loginPage">
  <h2>🔐 Login</h2>

  <input type="text" id="username" placeholder="Username" />
  <input type="password" id="password" placeholder="Password" />

  <button onclick="login()">Login</button>
  <p id="error"></p>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboardPage">
  <h2>👩‍🦰 Safe Women App</h2>

  <div class="menu">
    <button onclick="showSection('location')">📍 Live Location</button>
    <button onclick="showSection('sos')">🚨 SOS</button>
    <button onclick="showSection('defense')">🥋 Self Defense</button>
    <button onclick="logout()">🚪 Logout</button>
  </div>

  <!-- LOCATION -->
  <div class="section" id="location">
    <h3>Your Live Location</h3>
    <button onclick="getLocation()">Get Location</button>
    <p id="locationOutput"></p>
  </div>

  <!-- SOS -->
  <div class="section" id="sos">
    <h3>Emergency SOS</h3>
    <a href="tel:112">
      <button class="sos-btn">CALL 112</button>
    </a>
  </div>

  <!-- SELF DEFENSE -->
  <div class="section" id="defense">
    <h3>Self-Defense Techniques</h3>
    <ul class="defense-list">
      <li>👊 Hit nose or eyes</li>
      <li>🦵 Kick knee or shin</li>
      <li>🗣️ Shout loudly</li>
      <li>👜 Use bag or keys</li>
      <li>🏃 Run to safe place</li>
    </ul>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
