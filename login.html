<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — SafeHer</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-loading');
  </script>
  <style>.dark-loading body { background: #121212; }</style>
</head>
<body>

<div id="nav-placeholder"></div>

<div class="page">
  <div class="form-box">
    <h2>🔐 Login to SafeHer</h2>
    <div class="form-group">
      <label>Email Address</label>
      <input id="email" type="email" placeholder="you@example.com" required />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="password" type="password" placeholder="Your password" required />
    </div>
    <button class="btn-primary" onclick="login()">Login</button>
    <p class="form-footer">New user? <a href="register.html">Create account</a></p>
    <p class="form-footer" style="font-size:13px;color:var(--text-dim);margin-top:8px">
      💡 Demo: enter any email + password
    </p>
  </div>
</div>

<div id="footer-placeholder"></div>
<div class="toast" id="toast"></div>

<script src="theme.js"></script>
<script>
  function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) return toast('Please fill all fields');

    const name = email.split('@')[0];
    DB.setUser({
      id: Date.now(),
      fullName: name.charAt(0).toUpperCase() + name.slice(1),
      email, phoneNumber: ''
    });
    toast('✅ Logged in!');
    setTimeout(() => location.href = 'dashboard.html', 700);
  }
  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
