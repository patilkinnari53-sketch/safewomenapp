<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Location — SafeHer</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-loading');
  </script>
  <style>.dark-loading body { background: #121212; }</style>
</head>
<body>

<div id="nav-placeholder"></div>

<div class="page">
  <h1>📍 Live Location Sharing</h1>
  <p class="subtitle">Share your real-time GPS location with your trusted contacts.</p>

  <div class="card" style="padding:35px;text-align:left">
    <div style="display:flex;gap:15px;flex-wrap:wrap;justify-content:center;margin-bottom:20px">
      <button class="btn-primary" style="width:auto;padding:12px 26px" onclick="getLocation()">▶ Get My Location</button>
      <button class="btn-primary" style="width:auto;padding:12px 26px;background:var(--accent)" onclick="shareLocation()">📤 Share</button>
    </div>
    <div id="locInfo" style="background:var(--bg);padding:20px;border-radius:12px;text-align:left;margin-top:20px">
      <p style="color:var(--text-muted)">Click "Get My Location" to fetch your coordinates.</p>
    </div>
  </div>

  <h2 style="color:var(--primary);margin-top:40px">🗺️ Preview</h2>
  <div id="mapPreview" style="margin-top:15px;background:var(--card-bg);padding:20px;border-radius:12px;
    box-shadow:0 2px 10px var(--shadow);color:var(--text-muted);text-align:center">
    Location map preview will appear here.
  </div>
</div>

<div id="footer-placeholder"></div>
<div class="toast" id="toast"></div>

<script src="theme.js"></script>
<script>
  if (!guardAuth()) { /* redirected */ }

  let currentLoc = null;

  function getLocation() {
    if (!navigator.geolocation) return toast('Geolocation not supported');
    document.getElementById('locInfo').innerHTML = '<p>📡 Fetching location...</p>';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        currentLoc = { lat, lng };
        document.getElementById('locInfo').innerHTML = `
          <p><strong>Latitude:</strong> ${lat.toFixed(6)}</p>
          <p><strong>Longitude:</strong> ${lng.toFixed(6)}</p>
          <p><strong>Accuracy:</strong> ±${pos.coords.accuracy.toFixed(0)} m</p>
          <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank"
            style="color:var(--primary);font-weight:bold;text-decoration:none">
            🗺️ Open in Google Maps
          </a>
        `;
        document.getElementById('mapPreview').innerHTML = `
          <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=${lng-0.01},${lat-0.01},${lng+0.01},${lat+0.01}&layer=mapnik&marker=${lat},${lng}"
            style="width:100%;height:300px;border:none;border-radius:8px" loading="lazy"></iframe>
        `;
        toast('✅ Location fetched');
      },
      () => {
        document.getElementById('locInfo').innerHTML = '<p style="color:red">❌ Unable to get location</p>';
      },
      { enableHighAccuracy: true }
    );
  }

  function shareLocation() {
    if (!currentLoc) return toast('Get your location first');
    const link = `https://www.google.com/maps?q=${currentLoc.lat},${currentLoc.lng}`;
    if (navigator.share) {
      navigator.share({ title: 'My Live Location', text: 'I am here:', url: link });
    } else {
      navigator.clipboard.writeText(link).then(() => toast('📋 Link copied!'));
    }
  }
</script>
</body>
</html>
