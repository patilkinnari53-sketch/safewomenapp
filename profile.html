<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — SafeHer</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-loading');
  </script>
  <style>.dark-loading body { background: #121212; }</style>
</head>
<body>

<div id="nav-placeholder"></div>

<div class="page">
  <h1>👤 Your Profile</h1>
  <p class="subtitle">Manage your personal information.</p>

  <div class="form-box" style="margin:0 auto">
    <div style="text-align:center;margin-bottom:20px">
      <div id="avatar" style="width:90px;height:90px;border-radius:50%;
        background:linear-gradient(135deg,#7B1FA2,#E91E63);color:white;
        display:inline-flex;align-items:center;justify-content:center;
        font-size:36px;font-weight:bold">U</div>
    </div>
    <div class="form-group"><label>Full Name</label><input id="pName" placeholder="Your name" /></div>
    <div class="form-group"><label>Email</label><input id="pEmail" type="email" placeholder="you@example.com" /></div>
    <div class="form-group"><label>Phone Number</label><input id="pPhone" placeholder="+91 98765 43210" /></div>
    <button class="btn-primary" onclick="saveProfile()">Save Changes</button>
  </div>

  <h2 style="color:var(--primary);margin-top:40px;text-align:center">📊 Your Stats</h2>
  <div class="grid" style="margin-top:20px">
    <div class="card"><div style="font-size:40px">👥</div><h3 id="statContacts">0</h3><p>Contacts</p></div>
    <div class="card"><div style="font-size:40px">📜</div><h3 id="statAlerts">0</h3><p>Total Alerts</p></div>
    <div class="card"><div style="font-size:40px">✅</div><h3 id="statResolved">0</h3><p>Resolved</p></div>
  </div>

  <div style="text-align:center;margin-top:40px">
    <button class="btn-primary" style="width:auto;padding:12px 30px;background:#dc3545"
      onclick="if(confirm('Log out now?')) logout()">🚪 Logout</button>
  </div>
</div>

<div id="footer-placeholder"></div>
<div class="toast" id="toast"></div>

<script src="theme.js"></script>
<script>
  if (!guardAuth()) { /* redirected */ }

  (function init() {
    const user = DB.getUser();
    if (!user) return;
    document.getElementById('pName').value = user.fullName || '';
    document.getElementById('pEmail').value = user.email || '';
    document.getElementById('pPhone').value = user.phoneNumber || '';
    document.getElementById('avatar').textContent = (user.fullName || 'U').charAt(0).toUpperCase();
    renderStats();
  })();

  function saveProfile() {
    const user = DB.getUser();
    user.fullName = document.getElementById('pName').value.trim();
    user.email = document.getElementById('pEmail').value.trim();
    user.phoneNumber = document.getElementById('pPhone').value.trim();
    DB.setUser(user);
    document.getElementById('avatar').textContent = (user.fullName || 'U').charAt(0).toUpperCase();
    toast('✅ Profile updated');
  }

  function renderStats() {
    document.getElementById('statContacts').textContent = DB.getContacts().length;
    const alerts = DB.getAlerts();
    document.getElementById('statAlerts').textContent = alerts.length;
    document.getElementById('statResolved').textContent =
      alerts.filter(a => a.status === 'RESOLVED').length;
  }
</script>
</body>
</html>
