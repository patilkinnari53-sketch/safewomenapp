<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — SafeHer</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-loading');
  </script>
  <style>.dark-loading body { background: #121212; }</style>
</head>
<body>

<div id="nav-placeholder"></div>

<div class="page">
  <div class="form-box">
    <h2>📝 Create Your Account</h2>
    <div class="form-group"><label>Full Name</label><input id="fullName" placeholder="e.g. Priya Sharma" required /></div>
    <div class="form-group"><label>Email Address</label><input id="email" type="email" placeholder="you@example.com" required /></div>
    <div class="form-group"><label>Phone Number</label><input id="phone" placeholder="+91 98765 43210" required /></div>
    <div class="form-group"><label>Password</label><input id="password" type="password" placeholder="Min 6 characters" required /></div>
    <div class="form-group"><label>Confirm Password</label><input id="confirm" type="password" placeholder="Re-enter password" required /></div>
    <button class="btn-primary" onclick="register()">Create Account</button>
    <p class="form-footer">Already have an account? <a href="login.html">Login</a></p>
  </div>
</div>

<div id="footer-placeholder"></div>
<div class="toast" id="toast"></div>

<script src="theme.js"></script>
<script>
  function register() {
    const fullName = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    if (!fullName || !email || !phone || !password) return toast('Please fill all fields');
    if (password.length < 6) return toast('Password must be at least 6 characters');
    if (password !== confirm) return toast('Passwords do not match');

    DB.setUser({ id: Date.now(), fullName, email, phoneNumber: phone });
    toast('✅ Account created!');
    setTimeout(() => location.href = 'dashboard.html', 700);
  }
</script>
</body>
</html>
